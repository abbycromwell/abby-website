<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bubble Canopy — homepage direction study</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../src/styles/tokens.css" />
    <style>
      /*
        Each pod animates its own edge feather, so the radial-gradient stop has to
        be a registered property. Without @property it would snap instead of bleed.
      */
      @property --feather {
        syntax: "<percentage>";
        inherits: false;
        initial-value: 68%;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--color-text);
        background: var(--color-bg);
        font-family: var(--font-sans);
      }

      .canopy {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 100svh;
        padding: var(--space-hero-top) var(--space-edge) var(--space-xl);
        background: var(--color-bg) url("../../../src/assets/home/hero-watercolor-veins.png")
          center / cover no-repeat;
      }

      .canopy__nav {
        /*
          Overlays the top edge the way the real site's header does, instead of
          sitting inside the hero's top padding and pushing a band of empty paper
          above itself. z-index keeps the absolute pods off the links.
        */
        position: absolute;
        z-index: 2;
        top: 0;
        right: var(--space-edge);
        left: var(--space-edge);
        padding-block: var(--space-lg) var(--space-md);
        display: flex;
        justify-content: flex-end;
        gap: var(--space-lg);
        font-size: var(--text-xs);
        font-weight: var(--weight-medium);
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
      }

      .canopy__nav a {
        color: var(--color-text);
        text-decoration: none;
      }

      .canopy__nav a:hover { color: var(--color-accent); }

      h1 {
        max-width: 10ch;
        margin: var(--space-2xl) 0 var(--space-xs);
        color: var(--color-hero-name);
        font-size: var(--text-display);
        font-weight: var(--weight-light);
        line-height: var(--leading-hero);
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
      }

      .discipline {
        max-width: var(--max-width-prose);
        margin: 0 0 0 var(--space-2xs);
        color: var(--color-text-secondary);
        font-size: var(--text-sm);
        letter-spacing: var(--tracking-label);
        line-height: var(--leading-normal);
        text-transform: uppercase;
      }

      .discipline span { color: var(--color-hero-name); }

      /* The pods hang across the whole field rather than gathering in a row. */
      .pods {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        pointer-events: none;
      }

      .pod {
        position: absolute;
        pointer-events: auto;
      }

      /*
        All three hang in the right half so the name keeps its own air, and the
        highest one starts below the nav rather than drifting under Work/About.
      */
      .pod--illustration {
        top: 20%;
        right: 5%;
        width: clamp(10rem, 19vw, 18rem);
        --pod-shape: 58% 42% 47% 53% / 45% 52% 48% 55%;
        --pod-shape-held: 30% 70% 68% 32% / 65% 28% 72% 35%;
        --pod-shape-drift: 72% 28% 35% 65% / 30% 68% 32% 70%;
      }

      /*
        Animation takes the low right corner: it is the densest part of the wash,
        and a moving clip holds its own there where the pale spread did not.
      */
      .pod--animation {
        top: 62%;
        right: 9%;
        width: clamp(10.5rem, 19vw, 17.5rem);
        --pod-shape: 44% 56% 62% 38% / 57% 41% 59% 43%;
        --pod-shape-held: 70% 30% 28% 72% / 32% 68% 35% 65%;
        --pod-shape-drift: 28% 72% 65% 35% / 68% 30% 70% 32%;
      }

      .pod--typography {
        top: 46%;
        right: 38%;
        width: clamp(8rem, 15vw, 14rem);
        --pod-shape: 51% 49% 38% 62% / 44% 61% 39% 56%;
        --pod-shape-held: 25% 75% 62% 38% / 70% 35% 65% 30%;
        --pod-shape-drift: 68% 32% 30% 70% / 33% 72% 28% 67%;
      }

      .pod__link {
        display: block;
        position: relative;
        color: inherit;
        text-decoration: none;
      }

      /*
        Carries the pointer-driven deformation only. Rotating to the drag axis,
        stretching along it, then rotating back is what elongates the membrane in
        the direction of travel rather than just squashing it on the screen axes.
      */
      .pod__drag {
        display: block;
        /*
          The blend must sit here, not on the skin. This element's transform makes
          a stacking context, and mix-blend-mode only sees the backdrop of its own
          stacking context — on the skin it would blend against nothing and the pod
          would stop sinking into the watercolor.
        */
        mix-blend-mode: multiply;
        transform:
          translate(var(--drag-x, 0px), var(--drag-y, 0px))
          rotate(var(--drag-angle, 0deg))
          scale(var(--drag-stretch, 1), var(--drag-squash, 1))
          rotate(calc(var(--drag-angle, 0deg) * -1));
      }

      .pod__skin {
        display: block;
        position: relative;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        /* organic silhouette, set per pod so no two read the same */
        border-radius: var(--pod-shape);
        /* the blend that sinks this into the wash lives on .pod__drag */
        opacity: 0.8;
        /* the feather is what dissolves the artwork into the paper */
        mask-image: radial-gradient(
          ellipse at center,
          #000 var(--feather),
          transparent 92%
        );
        transition:
          --feather var(--duration-standard) var(--ease-out),
          border-radius 640ms var(--ease-out),
          opacity var(--duration-standard) var(--ease-out),
          transform var(--duration-standard) var(--ease-out);
      }

      .pod__skin img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /*
        The clip fills the pod the same way the stills do. Letterboxing it inside
        a blob left black bars that multiply turned into a hard dark slab.
      */
      .pod__clip {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /*
        Surface tension: the pod swells and sharpens, and its silhouette relaxes
        into a different irregular shape. It never resolves to a circle — a real
        bubble redistributes, it does not become geometry.
      */
      /*
        A bubble never holds a shape. While the pointer is on it the silhouette
        drifts between three states instead of settling, which is what separates
        a membrane from a masked image.
      */
      @keyframes pod-wobble {
        0% {
          border-radius: var(--pod-shape);
          transform: translate(0, 0) scale(1.04);
        }
        25% {
          border-radius: var(--pod-shape-held);
          transform: translate(5%, -6%) scale(1.1);
        }
        50% {
          border-radius: var(--pod-shape-drift);
          transform: translate(-4.5%, 5%) scale(1.02);
        }
        75% {
          border-radius: var(--pod-shape-held);
          transform: translate(6%, 3.5%) scale(1.08);
        }
        100% {
          border-radius: var(--pod-shape);
          transform: translate(0, 0) scale(1.04);
        }
      }

      .pod__link:hover .pod__skin,
      .pod__link:focus-visible .pod__skin {
        --feather: 82%;
        /* the artwork recedes so the category name owns the pod */
        opacity: 0.4;
        transform: scale(1.04);
        /*
          Sinusoidal in-out, not the system's --ease-out: a looping drift needs a
          symmetric curve or every segment lurches at the seam. No overshoot.
        */
        animation: pod-wobble 7s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .pod__link:focus-visible {
        outline: var(--border-thin) solid var(--color-hero-name);
        outline-offset: var(--space-xs);
      }

      /* the name alone, centred on the pod — no plate, no wash behind it */
      .pod__title {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--color-hero-name);
        font-size: var(--text-base);
        /* 600 is not in the design system's 300/400/500 set — see README */
        font-weight: 600;
        letter-spacing: var(--tracking-label);
        text-align: center;
        text-transform: uppercase;
        opacity: 0;
        transform: scale(0.96);
        transition:
          opacity var(--duration-standard) var(--ease-out),
          transform var(--duration-standard) var(--ease-out);
      }

      .pod__link:hover .pod__title,
      .pod__link:focus-visible .pod__title {
        opacity: 1;
        transform: translateY(0);
      }

      .note {
        position: fixed;
        left: var(--space-md);
        bottom: var(--space-sm);
        color: var(--color-hero-name);
        font-size: var(--text-xs);
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
        pointer-events: none;
      }

      @media (max-width: 47.99rem) {
        /* the canopy collapses to a stacked column; overlapping pods do not survive a phone */
        .pods {
          position: static;
          display: grid;
          gap: var(--space-2xl);
          margin-top: var(--space-2xl);
        }

        .pod,
        .pod--illustration,
        .pod--animation,
        .pod--typography {
          position: relative;
          top: auto;
          right: auto;
          left: auto;
          width: min(20rem, 78vw);
          margin-inline: auto;
        }

        /* no hover on touch, so the names stay put below their pods */
        .pod__title {
          position: static;
          margin-top: var(--space-sm);
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pod__skin { transition: opacity var(--duration-standard) var(--ease-out); }

        .pod__link:hover .pod__skin,
        .pod__link:focus-visible .pod__skin {
          border-radius: var(--pod-shape);
          transform: none;
          animation: none;
        }

        .pod__title {
          transform: none;
          transition: opacity var(--duration-standard) var(--ease-out);
        }
      }
    </style>
  </head>
  <body>
    <main class="canopy">
      <nav class="canopy__nav" aria-label="Main">
        <a href="#">Work</a>
        <a href="#">About</a>
      </nav>

      <h1>Abby<br />Cromwell</h1>
      <p class="discipline">
        Illustrative art <span>·</span> Character design <span>·</span> Storytelling
      </p>

      <ul class="pods">
        <li class="pod pod--illustration">
          <a class="pod__link" href="#">
            <span class="pod__drag">
              <span class="pod__skin">
                <img
                  src="../../../src/assets/illustration/confetti-profile.webp"
                  alt="Purple-haired figure in glasses facing a sketched face erupting into colorful confetti shapes"
                />
              </span>
            </span>
            <span class="pod__title">Illustration</span>
          </a>
        </li>

        <li class="pod pod--animation">
          <a class="pod__link" href="#">
            <span class="pod__drag">
              <span class="pod__skin">
                <video
                  class="pod__clip"
                  src="../../../src/assets/animation/rolling-rolling-tumbling-along.mp4"
                  aria-label="Rolling Rolling, Tumbling Along: a sphere rolls and tumbles across a colorful landscape"
                  muted
                  loop
                  playsinline
                  autoplay
                ></video>
              </span>
            </span>
            <span class="pod__title">Animation</span>
          </a>
        </li>

        <li class="pod pod--typography">
          <a class="pod__link" href="#">
            <span class="pod__drag">
              <span class="pod__skin">
                <img
                  src="../../../src/assets/case-study/spread-07.webp"
                  alt="SongBook page of monumental black Futura glyphs on a salmon ground"
                />
              </span>
            </span>
            <span class="pod__title">Typography</span>
          </a>
        </li>
      </ul>
    </main>

    <p class="note">Hover a pod · experiment only · not wired to the site</p>

    <script>
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      /* the system's motion rule: under reduced motion, clips wait rather than loop */
      if (reducedMotion.matches) {
        for (const video of document.querySelectorAll('video')) {
          video.autoplay = false;
          video.pause();
        }
      }

      /*
        The membrane answers the drag. Pointer velocity is smoothed into an offset,
        the offset gives an angle and a magnitude, and the pod elongates along that
        axis while trailing behind the cursor. Let go and surface tension pulls it
        back to rest. The CSS wobble keeps running underneath, untouched.
      */
      const FRICTION = 0.84;   // how fast a flick bleeds off
      const CHASE = 0.16;      // how eagerly the offset follows the velocity
      const LAG = 0.55;        // fraction of the offset spent trailing the cursor
      const MAX_STRETCH = 0.3; // elongation ceiling along the drag axis
      const SPEED_FOR_MAX = 85;
      const REST = 0.05;

      function wireDrag(pod) {
        const drag = pod.querySelector('.pod__drag');
        if (!drag) return;

        let lastX = 0;
        let lastY = 0;
        let tracking = false;
        let velocityX = 0;
        let velocityY = 0;
        let offsetX = 0;
        let offsetY = 0;
        let angle = 0;
        let running = false;

        function rest() {
          drag.style.removeProperty('--drag-x');
          drag.style.removeProperty('--drag-y');
          drag.style.removeProperty('--drag-angle');
          drag.style.removeProperty('--drag-stretch');
          drag.style.removeProperty('--drag-squash');
        }

        function tick() {
          velocityX *= FRICTION;
          velocityY *= FRICTION;
          offsetX += (velocityX - offsetX) * CHASE;
          offsetY += (velocityY - offsetY) * CHASE;

          const speed = Math.hypot(offsetX, offsetY);
          /* below the threshold the angle is noise, so the last one is held */
          if (speed > 0.6) angle = (Math.atan2(offsetY, offsetX) * 180) / Math.PI;
          const stretch = 1 + Math.min(speed / SPEED_FOR_MAX, 1) * MAX_STRETCH;

          drag.style.setProperty('--drag-x', (offsetX * LAG).toFixed(2) + 'px');
          drag.style.setProperty('--drag-y', (offsetY * LAG).toFixed(2) + 'px');
          drag.style.setProperty('--drag-angle', angle.toFixed(2) + 'deg');
          drag.style.setProperty('--drag-stretch', stretch.toFixed(4));
          /* volume is conserved: what it gains along the axis it loses across it */
          drag.style.setProperty('--drag-squash', (1 / stretch).toFixed(4));

          if (!tracking && speed < REST) {
            running = false;
            rest();
            return;
          }
          requestAnimationFrame(tick);
        }

        pod.addEventListener('pointermove', (event) => {
          if (reducedMotion.matches) return;
          if (tracking) {
            velocityX += event.clientX - lastX;
            velocityY += event.clientY - lastY;
          }
          lastX = event.clientX;
          lastY = event.clientY;
          tracking = true;
          if (!running) {
            running = true;
            requestAnimationFrame(tick);
          }
        }, { passive: true });

        pod.addEventListener('pointerleave', () => {
          tracking = false;
        }, { passive: true });
      }

      for (const pod of document.querySelectorAll('.pod')) wireDrag(pod);
    </script>
  </body>
</html>
