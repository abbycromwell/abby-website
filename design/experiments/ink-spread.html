const canvas = document.getElementById('c');
const errBox = document.getElementById('err');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function fail(msg) {
  canvas.remove();
  const img = new Image();
  img.src = ART_SRC;
  img.className = 'fallback';
  img.alt = 'Pale coral watercolor wash branching across a warm paper field';
  document.body.prepend(img);
  if (msg) { errBox.hidden = false; errBox.textContent = msg; }
}

const gl = canvas.getContext('webgl2', { antialias: false });
if (!gl) { fail('WebGL2 unavailable — showing static artwork.'); }

const QUAD_VS = `#version 300 es
layout(location=0) in vec2 p;
void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

const NOISE = `
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1,0)), u.x),
             mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * vnoise(p); p *= 2.03; a *= 0.5; }
  return v;
}
vec2 coverUV(vec2 uv, float canvasA, float artA){
  if (canvasA > artA) { uv.y = 0.5 + (uv.y - 0.5) * (artA / canvasA); }
  else { uv.x = 0.5 + (uv.x - 0.5) * (canvasA / artA); }
  return uv;
}`;

// Seed the field from the artwork's own red passages
const INIT_FS = `#version 300 es
precision highp float;
uniform sampler2D uArt;
uniform vec2 uRes;
uniform float uCanvasA, uArtA;
out vec4 o;
${NOISE}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 art = texture(uArt, coverUV(uv, uCanvasA, uArtA)).rgb;
  float redness = art.r - 0.5 * (art.g + art.b);
  float seed = smoothstep(0.10, 0.30, redness);
  o = vec4(art, seed * 0.9);
}`;

// Ink field: rgb = pigment color, a = ink amount. Creeps through receptive
// paper fibers; the mouse injects pigment sampled from the painting itself,
// or a varied red-family load on bare paper (dark picks run thicker).
const SIM_FS = `#version 300 es
precision highp float;
uniform sampler2D uField;
uniform sampler2D uArt;
uniform vec2 uRes;
uniform vec2 uMouse;      // sim uv, x<0 when idle
uniform float uSplat;     // extra strength on click
uniform vec3 uLoad;       // this stroke's ink load
uniform float uThick;     // this stroke's load weight
uniform float uCanvasA, uArtA;
out vec4 o;
${NOISE}
const vec3 WET_RED = vec3(0.663, 0.212, 0.192);
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 px = 1.0 / uRes;
  vec4 C = texture(uField, uv);
  const vec2 offs[8] = vec2[8](vec2(1,0), vec2(-1,0), vec2(0,1), vec2(0,-1),
                               vec2(1,1), vec2(-1,-1), vec2(1,-1), vec2(-1,1));
  float nbMax = 0.0;
  vec3 sumC = vec3(0.0);
  float sumA = 0.0;
  for (int i = 0; i < 8; i++) {
    vec4 n = texture(uField, uv + offs[i] * px);
    nbMax = max(nbMax, n.a * (i < 4 ? 1.0 : 0.85));
    sumC += n.rgb * n.a;
    sumA += n.a;
  }

  // filament channels: ink continues as branching veins, not clouds
  vec2 warp = vec2(fbm(uv * 9.0), fbm(uv * 9.0 + 5.2));
  float ridge = 1.0 - abs(2.0 * vnoise(uv * 14.0 + warp * 1.5) - 1.0);
  float vein = ridge * ridge * ridge;
  float receptive = 0.06 + 0.94 * smoothstep(0.50, 0.88, vein);
  float front = smoothstep(0.25, 0.85, nbMax) * (1.0 - C.a);
  float gain = 0.028 * front * receptive             // capillary creep along veins
             + 0.0014 * front;                       // watercolor keeps seeping

  float m = 0.0;
  vec3 P = WET_RED;
  if (uMouse.x >= 0.0) {
    float aspect = uRes.x / uRes.y;
    vec2 d = (uv - uMouse) * vec2(aspect, 1.0);
    vec3 touch = texture(uArt, coverUV(uMouse, uCanvasA, uArtA)).rgb;
    float redness = touch.r - 0.5 * (touch.g + touch.b);
    vec3 touchInk = mix(touch, touch * touch, 0.3); // gently concentrated touched paint
    P = mix(uLoad, touchInk, smoothstep(0.03, 0.12, redness));
    m = (0.045 + uSplat) * uThick * exp(-dot(d, d) * 4800.0);
  }

  float newA = clamp(C.a + gain + m, 0.0, 1.0);
  newA = mix(newA, sumA * 0.125, 0.025);             // soft wet-paper dispersion
  vec3 nbColor = sumA > 0.001 ? sumC / sumA : C.rgb;
  float total = C.a + gain + m;
  vec3 newC = total > 0.001 ? (C.rgb * C.a + nbColor * gain + P * m) / total : C.rgb;
  o = vec4(newC, newA);
}`;

const RENDER_FS = `#version 300 es
precision highp float;
uniform sampler2D uField;
uniform sampler2D uArt;
uniform vec2 uRes;
uniform vec2 uSimRes;
uniform float uCanvasA, uArtA;
uniform float uStatic;    // 1 = show finished artwork (reduced motion)
out vec4 o;
${NOISE}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 art = texture(uArt, coverUV(uv, uCanvasA, uArtA)).rgb;
  vec4 F = texture(uField, uv);
  float ink = F.a;
  float grain = fbm(uv * vec2(uCanvasA, 1.0) * 11.0);
  // reveal the painting only where the painting has pigment to reveal;
  // on bare paper the carried ink color must win
  float artness = smoothstep(0.04, 0.18, art.r - 0.5 * (art.g + art.b));
  float mask = smoothstep(0.18 + 0.42 * grain, 0.92, ink) * artness;
  mask = max(mask, uStatic);
  vec3 paper = vec3(0.965, 0.941, 0.906);
  vec3 dry = mix(paper, art, 0.22);                  // faint underprint
  vec3 col = mix(dry, art, mask);
  // watercolor is subtractive: multiply the carried pigment, thick = dark,
  // thin = light and vibrant; fades where the revealed painting takes over
  // Beer-Lambert wash: optical depth grows with accumulated ink, so dwelling
  // deepens the same pigment exactly like ink pooling into wet paper
  vec2 tuv = uv * vec2(uCanvasA, 1.0);
  float patchy = smoothstep(0.30, 0.75, fbm(tuv * 23.0 + 7.7));
  float rim = smoothstep(0.03, 0.10, ink) * (1.0 - smoothstep(0.10, 0.30, ink)) * patchy;
  // cauliflower granulation: cellular wash broken by pale crack boundaries
  float cellN = vnoise(tuv * 42.0 + fbm(tuv * 6.0) * 2.0);
  float crack = pow(1.0 - abs(2.0 * cellN - 1.0), 6.0);
  float granul = 0.72 + 0.55 * fbm(tuv * 47.0) - 0.45 * crack;
  // fine thread veins meandering through the wash, denser where ink is denser
  vec2 twarp = vec2(fbm(tuv * 5.0 + 2.3), fbm(tuv * 5.0 - 4.1));
  float tr = 1.0 - abs(2.0 * vnoise(tuv * 26.0 + twarp * 2.2) - 1.0);
  float thread = pow(tr, 14.0) * smoothstep(0.06, 0.4, ink);
  // seep halo: a feathered fringe of diluted pigment past the wet body
  vec2 spx = 2.0 / uSimRes;
  vec4 best = F;
  vec4 tap = texture(uField, uv + vec2(spx.x, 0.0)); if (tap.a > best.a) best = tap;
  tap = texture(uField, uv - vec2(spx.x, 0.0)); if (tap.a > best.a) best = tap;
  tap = texture(uField, uv + vec2(0.0, spx.y)); if (tap.a > best.a) best = tap;
  tap = texture(uField, uv - vec2(0.0, spx.y)); if (tap.a > best.a) best = tap;
  float feather = 0.4 + 0.6 * fbm(tuv * 31.0);
  float halo = smoothstep(0.04, 0.5, best.a - ink) * 0.20 * feather;
  float fade = (1.0 - 0.85 * mask) * (1.0 - uStatic);
  float depth = (ink * 2.4 * granul + rim * 0.9 + thread * 1.3) * fade;
  vec3 absorb = -log(clamp(F.rgb, 0.03, 0.97));
  vec3 haloAbsorb = -log(clamp(best.rgb, 0.03, 0.97));
  col *= exp(-min(absorb * depth + haloAbsorb * halo * fade, vec3(2.2)));
  o = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s) + '\n---\n' + src.split('\n').slice(0, 6).join('\n'));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, QUAD_VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

let simW, simH, texA, texB, fbA, fbB, artTex, artA;
let pInit, pSim, pRender;
const mouse = { x: -1, y: -1, splat: 0, t: 0 };
const load = { color: [0.663, 0.212, 0.192], thick: 0.8 };
const inks = { light: [], dark: [] };  // load colors sampled from the painting itself
function rollLoad() {
  const heavy = Math.random() < 0.18;
  const pool = heavy && inks.dark.length ? inks.dark : inks.light;
  if (pool.length) load.color = pool[(Math.random() * pool.length) | 0];
  load.thick = (heavy ? 1.1 : 0.65) + Math.random() * 0.25;
}
function sampleInks(img) {
  const w = 320, h = Math.max(1, Math.round((320 * img.height) / img.width));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const px = ctx.getImageData(0, 0, w, h).data;
  const painted = [];
  for (let i = 0; i < px.length; i += 4) {
    const r = px[i] / 255, g = px[i + 1] / 255, b = px[i + 2] / 255;
    if (r - 0.5 * (g + b) > 0.05) painted.push([r, g, b, 0.2126 * r + 0.7152 * g + 0.0722 * b]);
  }
  painted.sort((a, b) => b[3] - a[3]);
  const cut = Math.floor(painted.length * 0.6);
  inks.light = painted.slice(0, cut).map((p) => [p[0], p[1], p[2]]);
  inks.dark = painted.slice(cut).map((p) => [p[0], p[1], p[2]]);
  rollLoad();
}
rollLoad();

function makeSimTex() {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, simW, simH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return [t, fb];
}

function drawQuad(p) {
  gl.useProgram(p);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function setUniforms(p, entries) {
  gl.useProgram(p);
  for (const [name, ...v] of entries) {
    const loc = gl.getUniformLocation(p, name);
    if (v.length === 1) gl.uniform1f(loc, v[0]);
    else if (v.length === 2) gl.uniform2f(loc, v[0], v[1]);
    else gl.uniform3f(loc, v[0], v[1], v[2]);
  }
}

function resetField() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbA);
  gl.viewport(0, 0, simW, simH);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, artTex);
  setUniforms(pInit, [['uRes', simW, simH], ['uCanvasA', canvas.width / canvas.height], ['uArtA', artA]]);
  gl.uniform1i(gl.getUniformLocation(pInit, 'uArt'), 0);
  drawQuad(pInit);
}

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  const long = 480;
  const a = canvas.width / canvas.height;
  simW = a >= 1 ? long : Math.round(long * a);
  simH = a >= 1 ? Math.round(long / a) : long;
  [texA, fbA] = makeSimTex();
  [texB, fbB] = makeSimTex();
  resetField();
}

function frame() {
  const steps = 2;
  const active = performance.now() - mouse.t < 160;
  for (let i = 0; i < steps; i++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbB);
    gl.viewport(0, 0, simW, simH);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texA);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, artTex);
    setUniforms(pSim, [['uRes', simW, simH], ['uMouse', active ? mouse.x : -1, mouse.y], ['uSplat', mouse.splat],
      ['uLoad', load.color[0], load.color[1], load.color[2]], ['uThick', load.thick],
      ['uCanvasA', canvas.width / canvas.height], ['uArtA', artA]]);
    gl.uniform1i(gl.getUniformLocation(pSim, 'uField'), 0);
    gl.uniform1i(gl.getUniformLocation(pSim, 'uArt'), 1);
    drawQuad(pSim);
    [texA, texB] = [texB, texA];
    [fbA, fbB] = [fbB, fbA];
    mouse.splat = 0;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texA);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, artTex);
  setUniforms(pRender, [['uRes', canvas.width, canvas.height], ['uSimRes', simW, simH],
    ['uCanvasA', canvas.width / canvas.height], ['uArtA', artA], ['uStatic', reduced ? 1 : 0]]);
  gl.uniform1i(gl.getUniformLocation(pRender, 'uField'), 0);
  gl.uniform1i(gl.getUniformLocation(pRender, 'uArt'), 1);
  drawQuad(pRender);
  if (!reduced && !document.hidden) requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !reduced) requestAnimationFrame(frame);
});

if (gl) {
  const img = new Image();
  img.onload = () => {
    try {
      artA = img.width / img.height;
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

      artTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, artTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      pInit = program(INIT_FS);
      pSim = program(SIM_FS);
      pRender = program(RENDER_FS);
      sampleInks(img);
      resize();
      requestAnimationFrame(frame);
      if (reduced) requestAnimationFrame(frame); // draw one static frame
    } catch (e) { fail(String(e)); }
  };
  img.onerror = () => fail('Artwork failed to decode.');
  img.src = ART_SRC;

  addEventListener('resize', resize);
  addEventListener('pointermove', (e) => {
    if (performance.now() - mouse.t > 300) rollLoad();   // fresh dip after a pause
    mouse.x = e.clientX / innerWidth;
    mouse.y = 1 - e.clientY / innerHeight;
    mouse.t = performance.now();
  });
  addEventListener('pointerdown', (e) => {
    rollLoad();
    mouse.x = e.clientX / innerWidth;
    mouse.y = 1 - e.clientY / innerHeight;
    mouse.t = performance.now();
    mouse.splat = 0.9;
  });
  addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') resetField(); });
}
</script>
</body>
</html>
